name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'files.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: |
          unzip -o files.zip -d build_dir
          find build_dir | head -n 40
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find build_dir -name settings.gradle.kts | head -n 1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: WaifuPet-apk
          path: out/app-debug.apk
          
